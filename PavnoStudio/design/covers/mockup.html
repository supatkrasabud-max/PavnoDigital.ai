<!doctype html><html lang="th"><head><meta charset="utf-8">
<!-- ภาพ mockup 1200x1200 สำหรับ Shopee / Etsy / โพสต์: ?id=<product id>&v=book (หนังสือ 3 มิติ) หรือ v=inside (ข้างในมีอะไร) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600;700&family=Poppins:wght@500;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:1200px;overflow:hidden}
body{font-family:'Noto Sans Thai','Poppins',sans-serif;color:#1d2433}
.s{position:relative;width:1200px;height:1200px;overflow:hidden;background:radial-gradient(circle at 30% 25%,#fff 0%,var(--l) 70%)}
.blob{position:absolute;border-radius:50%;background:var(--a);opacity:.16}
.head{position:absolute;top:56px;left:70px;right:70px}
.brand{display:flex;align-items:center;gap:12px;font:600 20px 'Poppins';letter-spacing:4px;color:var(--d)}
.brand img{width:44px;height:44px;border-radius:11px}
h1{font:600 54px/1.15 'Mitr';margin-top:18px;color:#1d2433;max-width:780px}
.sub{font:500 26px 'Mitr';color:var(--d);margin-top:8px}
/* หนังสือ 3 มิติ */
.stage{position:absolute;left:110px;top:300px;width:620px;height:820px;perspective:2200px}
.book{position:absolute;left:40px;top:0;width:520px;height:735px;transform:rotateY(24deg) rotateX(4deg);transform-style:preserve-3d;transform-origin:left center}
.book .face{position:absolute;inset:0;border-radius:4px 14px 14px 4px;overflow:hidden;box-shadow:inset 6px 0 10px #0003}
.book .face img{width:100%;height:100%;display:block}
.book .face:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0003 0,#0000 4%,#fff2 6%,#0000 9%,#0000 70%,#fff3 100%)}
.book .edge{position:absolute;top:6px;bottom:6px;right:-26px;width:28px;transform:rotateY(90deg);transform-origin:left;background:repeating-linear-gradient(90deg,#fff 0 2px,#e7e2d8 2px 3px);border-radius:0 6px 6px 0}
.shadow{position:absolute;left:60px;top:735px;width:560px;height:60px;background:radial-gradient(ellipse at center,#0005 0%,#0000 70%);transform:translateY(-14px)}
.pages{position:absolute;right:70px;top:380px;width:430px;height:700px}
.pg{position:absolute;width:330px;height:467px;background:#fff;border-radius:10px;box-shadow:0 18px 40px #0002;overflow:hidden}
.pg img{width:100%;height:100%;display:block}
.pg1{right:0;top:0;transform:rotate(6deg)}
.pg2{right:70px;top:190px;transform:rotate(-4deg)}
.tags{position:absolute;left:70px;right:70px;bottom:50px;display:flex;gap:14px;justify-content:center}
.tag{background:#fff;border:3px solid var(--a);color:#1d2433;font:600 24px 'Noto Sans Thai';padding:12px 22px;border-radius:99px;box-shadow:0 5px 0 var(--a)}
.ribbon{position:absolute;top:70px;right:70px;background:var(--d);color:#fff;font:600 24px 'Mitr';padding:14px 24px;border-radius:18px;text-align:center;line-height:1.25;box-shadow:0 6px 0 #0002}
.ribbon b{display:block;font:800 34px 'Poppins'}
/* ข้างในมีอะไร */
.grid{position:absolute;left:70px;right:70px;top:300px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.grid .pg{position:static;width:100%;height:auto;aspect-ratio:580/820}
.pts{position:absolute;left:70px;right:70px;top:740px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pt{background:#fff;border-radius:22px;padding:22px 24px;font:600 27px/1.3 'Noto Sans Thai';display:flex;gap:16px;align-items:center;box-shadow:0 5px 0 var(--l2)}
.pt i{font-style:normal;flex:none;width:46px;height:46px;border-radius:50%;background:var(--a);color:#fff;font:800 24px 'Poppins';display:grid;place-items:center}
.meta{position:absolute;left:0;right:0;bottom:0;height:110px;background:var(--d);color:#fff;display:flex;align-items:center;justify-content:center;gap:26px;font:500 30px 'Mitr'}
.meta .dot{width:8px;height:8px;border-radius:50%;background:#ffffff80}
</style></head><body>
<div class="s" id="s"></div>
<script src="../../dist/assets/launch-products.js"></script>
<script>
const C={'thai-abc':['#ff7a59','#c63b3b','#ffe3d8'],'abc-tracing':['#3b8cff','#2747b8','#dceaff'],'hiragana':['#ef5d93','#bf3a6e','#ffe1ec'],'kanji-g1':['#c4487a','#7e2350','#f8dce6'],'chinese-60':['#e0302f','#8f1119','#ffe7c2'],'math-add':['#22b56a','#127a46','#d9f5e5'],'math-sub':['#13b3a8','#0b706f','#d4f4ef'],'math-mul':['#5fb43a','#357a1d','#e5f5d6'],'math-div':['#22977a','#135c4c','#d6efe5'],'math-bundle':['#139a84','#0b5f60','#d6f1ea'],'coloring':['#ff6f91','#8b3fd0','#ffe6ef']};
const q=new URLSearchParams(location.search),id=q.get('id')||'thai-abc',v=q.get('v')||'book';
const p=LAUNCH_PRODUCTS.find(x=>x.id===id),c=C[id],s=document.getElementById('s');
s.style.setProperty('--a',c[0]);s.style.setProperty('--d',c[1]);s.style.setProperty('--l',c[2]);s.style.setProperty('--l2',c[0]+'55');
const P='../../dist/assets/products/',img=n=>`${P}${id}-${n}.jpg`;
const g=Array.from({length:p.gallery||0},(_,i)=>img('g'+(i+1)));
const inside=[p.page.replace('/assets/products/',P),...g].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);
const pages=p.pages+' หน้า';
const head=t=>`<div class="head"><div class="brand"><img src="../../dist/assets/pavno-logo-tile.png" alt="">PAVNO LEARN</div><h1>${t}</h1><div class="sub">${p.category} · ${p.age}</div></div>`;
const blobs=`<div class="blob" style="width:520px;height:520px;right:-140px;top:-120px"></div><div class="blob" style="width:380px;height:380px;left:-120px;bottom:-110px"></div>`;
if(v==='inside'){
 s.innerHTML=blobs+head('ข้างในเล่มมีอะไร')+`<div class="ribbon"><b>${p.pages}</b>หน้า</div>
 <div class="grid">${inside.map(x=>`<div class="pg"><img src="${x}" alt=""></div>`).join('')}</div>
 <div class="pts">${p.points.map((t,i)=>`<div class="pt"><i>${i+1}</i>${t}</div>`).join('')}</div>
 <div class="meta"><b style="font-family:Poppins">PDF</b><span class="dot"></span>${pages}<span class="dot"></span>${p.size}<span class="dot"></span>${p.lang}</div>`;
}else{
 s.innerHTML=blobs+head(p.name)+`<div class="ribbon">ดาวน์โหลด<b>ทันที</b>หลังชำระเงิน</div>
 <div class="pages"><div class="pg pg1"><img src="${inside[0]}" alt=""></div><div class="pg pg2"><img src="${inside[1]||inside[0]}" alt=""></div></div>
 <div class="stage"><div class="shadow"></div><div class="book"><div class="face"><img src="${img('cover')}" alt=""></div><div class="edge"></div></div></div>
 <div class="tags"><div class="tag">PDF ${pages}</div><div class="tag">${p.size}</div><div class="tag">พิมพ์ซ้ำได้ไม่จำกัด</div></div>`;
}
</script></body></html>
